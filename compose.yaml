services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://smartreco:smartreco@postgres:5432/smartreco
      QDRANT_MODE: remote
      QDRANT_URL: http://qdrant:6333
      RUN_MIGRATIONS_ON_START: "true"
      SEED_ON_START: "true"


    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartreco
      POSTGRES_USER: smartreco
      POSTGRES_PASSWORD: smartreco
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U smartreco -d smartreco"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:

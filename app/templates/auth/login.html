{% extends "base.html" %}{% block title %}Log in — SmartReco{% endblock %}{% block content %}<div class="auth-card"><p class="eyebrow">Welcome back</p><h1>Log in to SmartReco.</h1>{% for error in errors %}<div class="alert error">{{ error }}</div>{% endfor %}<form method="post" action="/login"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="next" value="{{ next }}"><label>Email<input type="email" name="email" autocomplete="email" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="button" type="submit">Log in</button></form><p class="muted">New here? <a href="/register">Create an account</a>.</p></div>{% endblock %}

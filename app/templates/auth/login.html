{% extends "base.html" %}
{% block title %}Log in — SmartReco{% endblock %}
{% block content %}
<div class="auth-card">
  <p class="eyebrow">Welcome back</p>
  <h1>Log in to SmartReco.</h1>
  {% for error in errors %}<div class="alert error" role="alert">{{ error }}</div>{% endfor %}
  {% if google_auth_enabled %}
    <a class="button google-auth-button" href="/auth/google{% if next != '/' %}?next={{ next|urlencode }}{% endif %}"><span aria-hidden="true" class="google-auth-button__icon">G</span><span>Continue with Google</span></a>
    <div class="auth-divider" aria-hidden="true"><span>or</span></div>
  {% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="login-email">Email</label><input id="login-email" type="email" name="email" autocomplete="email" required>
    <label for="login-password">Password</label><input id="login-password" type="password" name="password" autocomplete="current-password" required>
    <button class="button" type="submit">Sign in</button>
  </form>
  <p class="muted">New here? <a href="/register{% if next != '/' %}?next={{ next|urlencode }}{% endif %}">Create an account</a>.</p>
</div>
{% endblock %}

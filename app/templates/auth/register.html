{% extends "base.html" %}{% block title %}Join SmartReco{% endblock %}{% block content %}<div class="auth-card"><p class="eyebrow">Start learning</p><h1>Create your account.</h1>{% for error in errors %}<div class="alert error">{{ error }}</div>{% endfor %}<form method="post" action="/register"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Full name<input name="full_name" maxlength="120" autocomplete="name" required></label><label>Email<input type="email" name="email" autocomplete="email" required></label><label>Password<input type="password" name="password" minlength="8" autocomplete="new-password" required></label><label>Confirm password<input type="password" name="password_confirm" minlength="8" autocomplete="new-password" required></label><button class="button" type="submit">Create account</button></form><p class="muted">Already registered? <a href="/login">Log in</a>.</p></div>{% endblock %}

<article class="course-card" data-course-id="{{ course.id }}"><div class="thumb" style="{% if course.thumbnail_url %}background-image:url('{{ course.thumbnail_url }}'){% endif %}"><span>{{ course.category }}</span></div><div class="card-body"><p class="muted">{{ course.difficulty|title }} · {{ course.duration_minutes }} min</p><h3><a href="/courses/{{ course.slug }}" data-course-click>{{ course.title }}</a></h3><p>{{ course.short_description }}</p><div class="card-meta"><span>{{ course.instructor }}</span><strong>{% if course.price == 0 %}Free{% else %}{{ course.currency }} {{ '%.2f'|format(course.price) }}{% endif %}</strong></div></div></article>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <!-- Glowing Orbs -->
  <circle cx="650" cy="120" r="180" fill="#6366f1" opacity="0.25" filter="url(#glow)"/>
  <circle cx="150" cy="380" r="140" fill="#a855f7" opacity="0.15" filter="url(#glow)"/>

  <!-- Visual Graphic Box -->
  <g transform="translate(380, 40)">
    <rect x="0" y="0" width="360" height="240" rx="20" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
    <g transform="translate(-20, 0)">
      
            <path d="M 100,160 Q 150,40 200,160" fill="none" stroke="#6366f1" stroke-width="3"/>
            <path d="M 140,160 Q 190,40 240,160" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="5,5"/>
            <line x1="175" y1="60" x2="215" y2="60" stroke="#ef4444" stroke-width="2"/>
            <polygon points="215,55 225,60 215,65" fill="#ef4444"/>
            <text x="145" y="185" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#ef4444">DRIFT DETECTED</text>
        
    </g>
  </g>

  <!-- Content Glass Panel -->
  <rect x="50" y="50" width="480" height="350" rx="24" fill="#0d1512" fill-opacity="0.65" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Text Content -->
  <g transform="translate(85, 95)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="176" height="28" rx="14" fill="#6366f1" fill-opacity="0.3" stroke="#a855f7" stroke-opacity="0.6" stroke-width="1"/>
    <text x="12" y="18" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#a855f7" letter-spacing="1.5">MACHINE LEARNING</text>

    <!-- Title -->
    <text x="0" y="70" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="900" fill="#ffffff" letter-spacing="-0.5">MLOps Model Monitoring</text>
    <text x="0" y="105" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="900" fill="#ffffff" letter-spacing="-0.5">&amp; Drift Detection</text>

    <!-- Tagline -->
    <text x="0" y="155" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#a0aec0">
      Feature Shift &amp; Performance Tracking
    </text>

    <!-- Badges -->
    <g transform="translate(0, 195)">
      <rect x="0" y="0" width="110" height="32" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="14" y="21" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">SmartReco</text>

      <rect x="122" y="0" width="140" height="32" rx="8" fill="#6366f1" fill-opacity="0.25"/>
      <text x="134" y="21" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#a855f7">★ Verified Course</text>
    </g>
  </g>
</svg>